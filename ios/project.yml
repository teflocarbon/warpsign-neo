# XcodeGen spec for the WarpSign iOS app: run tools/build_ios.sh, which builds
# the Rust core and then generates WarpSign.xcodeproj from this file.
name: WarpSign
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WarpSign:
    type: application
    platform: iOS
    sources:
      - WarpSign
    dependencies:
      # Built by tools/build_ios.sh from crates/warpsign-ffi
      - framework: Frameworks/WarpsignFFI.xcframework
        embed: false
      - target: WarpSignTunnel
    # Managing its own loopback VPN (Platform/LoopbackTunnel.swift). CI
    # ad-hoc signs with these, so signing WarpSign with WarpSign sees them.
    entitlements:
      path: WarpSign/WarpSign.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        # Change to your own; the app re-provisions itself once installed
        PRODUCT_BUNDLE_IDENTIFIER: com.example.warpsign
        # The Rust core is only built for arm64 simulators (Apple silicon)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: WarpSign/Info.plist
      properties:
        CFBundleDisplayName: WarpSign
        UILaunchScreen: {}
        # Keeps WarpSign alive while iOS downloads an app from it (silent
        # audio, as ESign does): see Platform/KeepAlive.swift
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Let IPAs and profiles be opened in WarpSign from Files and the share sheet
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
          - CFBundleTypeName: Provisioning Profile
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.mobileprovision
          - CFBundleTypeName: Device Pairing File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.warpsign.mobiledevicepairing
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobileprovision
          - UTTypeIdentifier: dev.warpsign.mobiledevicepairing
            UTTypeDescription: Device Pairing File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobiledevicepairing
  # The loopback VPN (WarpSignTunnel/PacketTunnelProvider.swift), so
  # installing needs no LocalDevVPN
  WarpSignTunnel:
    type: app-extension
    platform: iOS
    sources:
      - WarpSignTunnel
    entitlements:
      path: WarpSignTunnel/WarpSignTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.warpsign.Tunnel
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: WarpSignTunnel/Info.plist
      properties:
        CFBundleDisplayName: WarpSign VPN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
