[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Big-number maths (RSA key generation, SRP) is unbearably slow unoptimised
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
