name: iOS IPA

# Manual: an unsigned Release WarpSign.ipa, for signing with warpsign itself
# (macOS runners cost 10x the minutes of Linux ones)
on:
  workflow_dispatch:

# To publish the IPA on the rolling "latest" release
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Rust core, bindings and Xcode project
        run: tools/build_ios.sh
      - name: Build app for device (unsigned)
        run: >
          xcodebuild -project ios/WarpSign.xcodeproj -scheme WarpSign
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/WarpSign.app ipa/Payload/
          # Ad-hoc signed with its entitlements, so signing WarpSign with
          # WarpSign knows the VPN extension needs Network Extensions
          app=ipa/Payload/WarpSign.app
          codesign --force --sign - --entitlements ios/WarpSignTunnel/WarpSignTunnel.entitlements \
            "$app/PlugIns/WarpSignTunnel.appex"
          codesign --force --sign - --entitlements ios/WarpSign/WarpSign.entitlements "$app"
          codesign -d --entitlements - "$app/PlugIns/WarpSignTunnel.appex"
          (cd ipa && zip -qry ../WarpSign.ipa Payload)
          unzip -l WarpSign.ipa | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: WarpSign-ipa
          path: WarpSign.ipa
          if-no-files-found: error
      # A plain .ipa link Safari saves straight to Files: iOS can't always
      # unzip artifact downloads ("Bad message")
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned WarpSign.ipa from $GITHUB_SHA, for signing with WarpSign or the CLI."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest WarpSign.ipa --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest WarpSign.ipa --prerelease \
              --title "WarpSign (latest build)" --notes "$notes" --target "$GITHUB_SHA"
          fi
