name: CLI binaries

# Manual: builds a ready-to-run `warpsign` for Windows and Linux (macOS
# runners cost 10x, so build it there with cargo install for now)
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: warpsign.exe
            name: warpsign-windows-x64
          - os: ubuntu-latest
            binary: warpsign
            name: warpsign-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p warpsign-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
