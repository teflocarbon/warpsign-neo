[package]
name = "warpsign-core"
description = "Provisioning, ID mapping and signing logic shared by the warpsign-neo CLI and iOS app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Notarization (on by default) pulls in an AWS SDK we don't need
apple-codesign = { version = "0.29", default-features = false }
base64 = "0.22"
cryptographic-message-syntax = "0.27"
getrandom = "0.4.3"
hmac = "0.13.0"
# Installing on devices (lockdown, AFC, installation_proxy), as SideStore
# and Xcode do. ring rather than the default aws-lc: no CMake to cross-compile.
idevice = { version = "0.1.68", default-features = false, features = [
    "ring",
    "tcp",
    "usbmuxd",
    "afc",
    "installation_proxy",
    "heartbeat",
    "pair",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
indexmap = "2"
num-bigint = "0.5.1"
p12-keystore = "0.4"
pbkdf2 = "0.13.0"
plist = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.11.0"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "io-util", "net"] }
x509-certificate = "0.24.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
bcder = "0.7"
pem = "3"
tempfile = "3"
